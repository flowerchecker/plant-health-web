site_name: Plant Health Web
site_url: https://plant-health-web-4dd569.gitlab.io/
# repo_url: https://gitlab.com/flowerchecker/plant-health-web/

# Top-level extra used by theme templates (set generator to false to hide default attribution)
extra:
  generator: false

theme:
  name: material
  custom_dir: overrides
  favicon: assets/logo_.png
  logo:
    assets/logo_.png
  palette:
    primary: black
  features:
    - navigation.indexes

nav:
    - index.md
    - diseases/dead-plant.md
    - diseases/dry-air.md
    - diseases/emerging-leaf.md
    - diseases/feeding-damage-by-insects.md
    - diseases/finished-flowering-period.md
    - diseases/herbicide-damage.md
    - diseases/inappropriate-leaf-rosette-watering.md
    - diseases/lack-of-light.md
    - diseases/leaf-miners.md
    - diseases/light-excess.md
    - diseases/light-or-heat-source-damage.md
    - diseases/nutrient-deficiency.md
    - diseases/pesticide-damage.md
    - diseases/root-damage.md
    - diseases/sap-sucking-pests.md
    - diseases/sunburn.md
    - diseases/sunscald.md
    - diseases/water-deficiency.md
    - diseases/water-excess-or-uneven-watering.md
    - diseases/water-spray-liquid-residue.md
    - diseases/watering-on-the-leaves.md

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
          site_name: Plant Health Web (English)
        - locale: de
          name: Deutsch
          build: true
          site_name: Plant Health Web (Deutsch)
        - locale: cs
          name: Čeština
          build: true
          site_name: Plant Health Web (Čeština)
        - locale: ar
          name: العربية
          build: true
          site_name: Plant Health Web (العربية)
        - locale: da
          name: Dansk
          build: true
          site_name: Plant Health Web (Dansk)
        - locale: es
          name: Español
          build: true
          site_name: Plant Health Web (Español)
        - locale: fr
          name: Français
          build: true
          site_name: Plant Health Web (Français)
        - locale: hi
          name: हिन्दी
          build: true
          site_name: Plant Health Web (हिन्दी)
        - locale: it
          name: Italiano
          build: true
          site_name: Plant Health Web (Italiano)
        - locale: ko
          name: 한국어
          build: true
          site_name: Plant Health Web (한국어)
        - locale: nl
          name: Nederlands
          build: true
          site_name: Plant Health Web (Nederlands)
        - locale: pl
          name: Polski
          build: true
          site_name: Plant Health Web (Polski)
        - locale: pt
          name: Português
          build: true
          site_name: Plant Health Web (Português)
        - locale: sv
          name: Svenska
          build: true
          site_name: Plant Health Web (Svenska)
        - locale: tr
          name: Türkçe
          build: true
          site_name: Plant Health Web (Türkçe)
        - locale: zh
          name: 中文 (简体)
          build: true
          site_name: Plant Health Web (中文)
        - locale: zh-Hant
          name: 中文 (繁體)
          build: true
          site_name: Plant Health Web (中文 - 繁體)
