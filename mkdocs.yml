site_name: Plant Health Web
site_url: https://plant-health-web-4dd569.gitlab.io/
# repo_url: https://gitlab.com/flowerchecker/plant-health-web/

# Top-level extra used by theme templates (set generator to false to hide default attribution)
extra:
  generator: false

theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon.ico
  logo:
    assets/logo.png
  palette:
    primary: black
  features:
    - navigation.indexes

nav:
    - index.md
    - dead-plant.md
    - dry-air.md
    - emerging-leaf.md
    - feeding-damage-by-insects.md
    - finished-flowering-period.md
    - herbicide-damage.md
    - inappropriate-leaf-rosette-watering.md
    - lack-of-light.md
    - leaf-miners.md
    - light-excess.md
    - light-or-heat-source-damage.md
    - nutrient-deficiency.md
    - pesticide-damage.md
    - root-damage.md
    - sap-sucking-pests.md
    - sunburn.md
    - sunscald.md
    - water-deficiency.md
    - water-excess-or-uneven-watering.md
    - water-spray-liquid-residue.md
    - watering-on-the-leaves.md

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
          site_name: Library plant.health
        - locale: de
          name: Deutsch
          build: true
          site_name: Bibliothek plant.health
        - locale: cs
          name: Čeština
          build: true
          site_name: Knihovna plant.health
        - locale: ar
          name: العربية
          build: true
          site_name: مكتبة plant.health
        - locale: da
          name: Dansk
          build: true
          site_name: Bibliotek plant.health
        - locale: es
          name: Español
          build: true
          site_name: Biblioteca plant.health
        - locale: fr
          name: Français
          build: true
          site_name: Bibliothèque plant.health
        - locale: hi
          name: हिन्दी
          build: true
          site_name: पुस्तकालय plant.health
        - locale: it
          name: Italiano
          build: true
          site_name: Biblioteca plant.health
        - locale: ko
          name: 한국어
          build: true
          site_name: 라이브러리 plant.health
        - locale: nl
          name: Nederlands
          build: true
          site_name: Bibliotheek plant.health
        - locale: pl
          name: Polski
          build: true
          site_name: Biblioteka plant.health
        - locale: pt
          name: Português
          build: true
          site_name: Biblioteca plant.health
        - locale: sv
          name: Svenska
          build: true
          site_name: Bibliotek plant.health
        - locale: tr
          name: Türkçe
          build: true
          site_name: Kütüphane plant.health
        - locale: zh
          name: 中文 (简体)
          build: true
          site_name: 图书馆 plant.health
        - locale: zh-Hant
          name: 中文 (繁體)
          build: true
          site_name: 圖書館 plant.health
