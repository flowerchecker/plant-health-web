site_name: Plant Health Web
site_url: https://plant-health-web-4dd569.gitlab.io/
# repo_url: https://gitlab.com/flowerchecker/plant-health-web/

# Top-level extra used by theme templates (set generator to false to hide default attribution)
extra:
  generator: false

# Copyright shown in the footer
copyright: "© 2025 kindwise. All rights reserved."

theme:
  name: material
  custom_dir: overrides
  logo:
    assets/logo_.png
  palette:
    primary: black
  features:
    - navigation.tabs
    - navigation.indexes

nav:
  - Diseases:
    - index.en.md
    - diseases/dead-plant.md
    - diseases/dry-air.md
    - diseases/emerging-leaf.md
    - diseases/feeding-damage-by-insects.md
    - diseases/finished-flowering-period.md
    - diseases/herbicide-damage.md
    - diseases/inappropriate-leaf-rosette-watering.md
    - diseases/lack-of-light.md
    - diseases/leaf-miners.md
    - diseases/light-excess.md
    - diseases/light-or-heat-source-damage.md
    - diseases/nutrient-deficiency.md
    - diseases/pesticide-damage.md
    - diseases/root-damage.md
    - diseases/sap-sucking-pests.md
    - diseases/sunburn.md
    - diseases/sunscald.md
    - diseases/water-deficiency.md
    - diseases/water-excess-or-uneven-watering.md
    - diseases/water-spray-liquid-residue.md
    - diseases/watering-on-the-leaves.md

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
          site_name: Plant Health Web (English)
          nav_translations:
            Diseases: Diseases
        - locale: de
          name: Deutsch
          build: true
          site_name: Plant Health Web (Deutsch)
          nav_translations:
            Diseases: Krankheiten
        - locale: cs
          name: Čeština
          build: true
          site_name: Plant Health Web (Čeština)
          nav_translations:
            Diseases: Nemoci
        - locale: ar
          name: العربية
          build: true
          site_name: Plant Health Web (العربية)
          nav_translations:
            Diseases: الأمراض
        - locale: da
          name: Dansk
          build: true
          site_name: Plant Health Web (Dansk)
          nav_translations:
            Diseases: Sygdomme
        - locale: es
          name: Español
          build: true
          site_name: Plant Health Web (Español)
          nav_translations:
            Diseases: Enfermedades
        - locale: fr
