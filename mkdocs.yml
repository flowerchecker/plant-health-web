site_name: Plant Health Web
site_url: https://plant-health-web-4dd569.gitlab.io/
repo_url: https://gitlab.com/flowerchecker/plant-health-web/

# Top-level extra used by theme templates (set generator to false to hide default attribution)
extra:
  generator: false

# Copyright shown in the footer
copyright: "© 2025 kindwise. All rights reserved."

theme:
  name: material
  logo:
    assets/logo.png
  palette:
    primary: black
  features:
    - navigation.tabs
    - navigation.indexes

nav:
  - Diseases:
    - diseases/dead-plant.md

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
          site_name: Plant Health Web (English)
          link: /en/
        - locale: cs
          name: Čeština
          build: true
          site_name: Plant Health Web (Čeština)
          nav_translations:
            Diseases: Nemoci